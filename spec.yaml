schemaVersion: "2"
kind: sandbox
name: pi
version: "0.1.0"
displayName: Pi
description: Pi coding agent (pi.dev) in a Docker sandbox.
sourceURL: https://github.com/earendil-works/pi

sandbox:
  # Local image loaded via `sbx template load`. For a team, push to a
  # registry and pin by digest instead.
  image: "pi-sandbox:0.85.1"
  entrypoint: [pi, -a]

agentInstructions:
  filename: AGENTS.md
  content: |
    ## Sandbox environment

    Tu tournes dans une microVM Docker Sandbox. `sudo` est sans mot de passe,
    Docker est disponible a l'interieur de la VM. Le reseau sortant est filtre
    par une allowlist: un domaine non autorise echoue, ce n'est pas une panne
    reseau. La cle du provider n'est pas dans la VM, seule une sentinelle l'est.

environment:
  variables:
    PI_SKIP_VERSION_CHECK: "1"
    PI_TELEMETRY: "0"

credentials:
  # One key covers opencode-go and opencode (Zen): pi reads OPENCODE_API_KEY
  # for both. proxyManaged => the VM only sees the sentinel value.
  - service: opencode-go
    description: OpenCode API key used by pi (opencode-go and opencode Zen)
    required: true
    apiKey:
      name: OPENCODE_API_KEY
      proxyManaged: true
      inject:
        # openai-completions / openai-responses models (deepseek-v4-flash,
        # glm-*, kimi-*, gpt-5.6-luna, grok-4.5, ...).
        # Explicit header/format rather than the `scheme: bearer` shortcut.
        # Both inject correctly on sbx 0.42.1, but the x-api-key entry
        # below has no shortcut, so the explicit form keeps one style here.
        # It also works on sbx 0.38.0, which validates `scheme` and then
        # ignores it ("skipping empty service auth config" in daemon.log).
        - domain: opencode.ai
          header: Authorization
          format: "Bearer %s"
        # anthropic-messages models (minimax-m3, qwen3.7-max, qwen3.7-plus,
        # qwen3.8-max): pi sends x-api-key instead of Authorization.
        # Only enable this if you use these models, see README.
        # - domain: opencode.ai
        #   header: x-api-key
        #   format: "%s"

permissions:
  network:
    allow:
      - opencode.ai
      - github.com
      - raw.githubusercontent.com
      - pypi.org
      - files.pythonhosted.org
    deny:
      - pi.dev
